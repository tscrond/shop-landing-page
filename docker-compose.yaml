services:
  shop-landing-page:
    depends_on:
      - db
    image: shop-landing-page:local
    container_name: shop-landing-page
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - SERVE_STATIC=/app/frontend/dist
      - CORS_ORIGIN=http://localhost:8001
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB} # use this only for postgres
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DB_PROVIDER=memory
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - SMTP_HOST=mail-eu.smtp2go.com
      - SMTP_PORT=587
      - SMTP_USERNAME=skrond.com
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"